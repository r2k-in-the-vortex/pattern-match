[package]
name = "pm-core"
description = "Pattern-match detection algorithms and data types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Webcam capture through `nokhwa`'s Windows Media Foundation backend.
camera = ["dep:nokhwa"]

[dependencies]
image.workspace = true
nalgebra.workspace = true
nokhwa = { workspace = true, optional = true, features = ["input-msmf", "camera-sync-impl"] }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
nalgebra.workspace = true
serde.workspace = true
serde_json.workspace = true
