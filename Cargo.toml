[workspace]
resolver = "3"
members = ["crates/pm-core", "crates/pm-ui", "crates/pm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
image = "0.25.10"
nalgebra = "0.35.0"
rayon = "1.12.0"
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = "9.0.5"

[workspace.dependencies.pm-core]
path = "crates/pm-core"

[profile.release]
lto = "thin"
