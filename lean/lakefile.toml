name = "PatternMatch"
version = "0.1.0"
defaultTargets = ["PatternMatch", "golden"]

# Mathlib is pinned to the release supporting the toolchain in lean-toolchain.
# M1 imports only the Mathlib modules it needs. Run `lake exe cache get` in this
# directory before the first Mathlib-dependent build to download prebuilt oleans
# (README §10.1); afterwards it is not needed.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "PatternMatch"

[[lean_exe]]
name = "golden"
root = "Main"
